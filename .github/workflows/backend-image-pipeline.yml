name: backend-image-pipeline

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Artifact Registry image tag to promote to main"
        required: true
        type: string
      release_version:
        description: "main release version, for example 0.1.0"
        required: true
        type: string

env:
  # Update these values for your GCP project and Artifact Registry location.
  GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: PR validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Build Docker image locally
        run: |
          docker build -t backend-server:pr-${{ github.event.pull_request.number }} .

  build_and_push_dev:
    name: Build and push dev image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_base: ${{ steps.meta.outputs.image_base }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Preferred approach: Workload Identity Federation.
          # Replace with your GitHub OIDC provider resource name.
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Derive tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DEV_VERSION="${{ vars.DEV_VERSION || '0.0.1' }}"
          IMAGE_TAG="dev-${DEV_VERSION}-${SHORT_SHA}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "dev_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_base=${GCP_REGION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${AR_REPOSITORY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          IMAGE_BASE="${{ steps.meta.outputs.image_base }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          DEV_VERSION="${{ steps.meta.outputs.dev_version }}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"

          docker buildx create --use
          docker buildx build \
            --push \
            --platform linux/amd64 \
            -t "${IMAGE_BASE}:dev-${DEV_VERSION}" \
            -t "${IMAGE_BASE}:${IMAGE_TAG}" \
            -t "${IMAGE_BASE}:sha-${SHORT_SHA}" \
            -t "${IMAGE_BASE}:dev-latest" \
            .

  deploy_staging:
    name: Deploy dev image to staging VM
    runs-on: ubuntu-latest
    needs: build_and_push_dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_VM_HOST }}
          username: ${{ secrets.STAGING_VM_USER }}
          key: ${{ secrets.STAGING_VM_SSH_KEY }}
          port: ${{ secrets.STAGING_VM_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            DEPLOY_DIR="${{ vars.STAGING_DEPLOY_DIR }}"
            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="/opt/backend-staging"
            fi

            cd "$DEPLOY_DIR"

            if [ ! -f .env ]; then
              echo ".env not found in ${DEPLOY_DIR}"
              exit 1
            fi

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i.bak "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ needs.build_and_push_dev.outputs.image_tag }}/" .env
            else
              echo "IMAGE_TAG=${{ needs.build_and_push_dev.outputs.image_tag }}" >> .env
            fi

            docker compose pull
            docker compose up -d

  promote_to_main:
    name: Promote dev image to main
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Preferred approach: Workload Identity Federation.
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Promote source tag to main tags
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          IMAGE_BASE="${GCP_REGION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${AR_REPOSITORY}/${IMAGE_NAME}"
          SOURCE_IMAGE="${IMAGE_BASE}:${SOURCE_TAG}"
          SHORT_SHA="${SOURCE_TAG##*-}"

          # Retag the already-built image digest into the main namespace.
          gcloud artifacts docker tags add "${SOURCE_IMAGE}" "${IMAGE_BASE}:main-${RELEASE_VERSION}"
          gcloud artifacts docker tags add "${SOURCE_IMAGE}" "${IMAGE_BASE}:main-${RELEASE_VERSION}-${SHORT_SHA}"
          gcloud artifacts docker tags add "${SOURCE_IMAGE}" "${IMAGE_BASE}:main-latest"
